# golangci-lint v2 configuration.
# Conservative baseline: the standard linter set plus gofmt formatting.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  exclusions:
    presets:
      # Unchecked errors that are conventionally ignored: fmt.Fprint* to
      # stdout/stderr, deferred Close, os.Setenv/Remove, ...
      - std-error-handling
    rules:
      # De Morgan rewrites: `!(a < b && b < c)` reads better as "not ordered".
      - linters: [staticcheck]
        text: "QF1001"

formatters:
  enable:
    - gofmt
