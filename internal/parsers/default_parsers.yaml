# Built-in project types. A user file at ~/.paleta/parsers.yaml adds to or
# overrides these by name. `priority` orders the types found in one folder
# (lower first); a type without one sorts after all that have one.
parsers:
  npm:
    detect_files: ["package.json"]
    priority: 30
    base_commands:
      install: "npm install"
      audit: "npm audit"
      outdated: "npm outdated"
      update: "npm update"
    builtin_parser: "package_json_scripts"
    command_template: "npm run {key}"
    
  yarn:
    detect_files: ["package.json"]
    priority: 31
    base_commands:
      install: "yarn install"
      audit: "yarn audit"
      outdated: "yarn outdated"
      upgrade: "yarn upgrade"
    builtin_parser: "package_json_scripts"
    command_template: "yarn {key}"
    
  pnpm:
    detect_files: ["package.json"]
    priority: 32
    base_commands:
      install: "pnpm install"
      audit: "pnpm audit"
      outdated: "pnpm outdated"
      update: "pnpm update"
    builtin_parser: "package_json_scripts"
    command_template: "pnpm run {key}"
    
  go:
    detect_files: ["go.mod"]
    priority: 10
    base_commands:
      build: "go build ./..."
      test: "go test ./..."
      fmt: "go fmt ./..."
      vet: "go vet ./..."
      mod: "go mod tidy"
      clean: "go clean"
      install: "go install"
      get: "go get"
      generate: "go generate ./..."
      doc: "go doc"
      version: "go version"
    builtin_parser: "go_standard"
    
  python:
    detect_files: ["pyproject.toml", "setup.py", "requirements.txt"]
    priority: 40
    base_commands:
      install: "pip install -e ."
      test: "python -m pytest"
      lint: "python -m flake8"
      format: "python -m black ."
    parser_command: "python -c \"import toml; print('\\n'.join(toml.load('pyproject.toml').get('project', {}).get('scripts', {}).keys()))\" 2>/dev/null || echo"
    command_template: "{key}"
    
  rust:
    detect_files: ["Cargo.toml"]
    priority: 20
    base_commands:
      build: "cargo build"
      test: "cargo test"
      run: "cargo run"
      check: "cargo check"
      fmt: "cargo fmt"
      clippy: "cargo clippy"
      doc: "cargo doc"
      clean: "cargo clean"
      update: "cargo update"
    
  make:
    detect_files: ["Makefile", "makefile"]
    priority: 70
    parser_command: "make -qp 2>/dev/null | grep -E '^[a-zA-Z_][a-zA-Z0-9_-]*:' | cut -d: -f1 | grep -v '^\\.' | sort -u"
    command_template: "make {key}"
    
  docker:
    detect_files: ["Dockerfile"]
    priority: 90
    base_commands:
      build: "docker build ."
      run: "docker run --rm <image>"

  compose:
    detect_files: ["docker-compose.yml", "docker-compose.yaml", "docker-compose.*.yml", "docker-compose.*.yaml", "compose.yml", "compose.yaml", "compose.*.yml", "compose.*.yaml"]
    priority: 80
    base_commands:
      up: "docker compose up"
      down: "docker compose down"
      build: "docker compose build"
      logs: "docker compose logs -f"
      ps: "docker compose ps"
    # Each env-specific file (docker-compose.dev.yaml, compose.prod.yml) also gets
    # the base commands as `dev:up`, `dev:down`, ... run with `-f <file>`.
    builtin_parser: "compose_files"

  gradle:
    detect_files: ["build.gradle", "build.gradle.kts"]
    priority: 60
    base_commands:
      build: "./gradlew build"
      test: "./gradlew test"
      clean: "./gradlew clean"
      assemble: "./gradlew assemble"
    parser_command: "./gradlew tasks --all | grep -E '^[a-zA-Z]' | cut -d' ' -f1 | sort -u"
    command_template: "./gradlew {key}"
    
  maven:
    detect_files: ["pom.xml"]
    priority: 50
    base_commands:
      compile: "mvn compile"
      test: "mvn test"
      package: "mvn package"
      install: "mvn install"
      clean: "mvn clean"
    parser_command: "mvn help:describe -Dcmd=compile | grep -E '^[a-zA-Z]' | cut -d' ' -f1 | sort -u"
    command_template: "mvn {key}"